[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rtxopt"
version = "0.1.0"
description = "Reproducible llama.cpp decode-performance harness and guard-railed profiling agent (RTX 3080)"
requires-python = ">=3.12"
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5"]

[project.scripts]
rtxopt-env = "rtxopt.runners.env_manifest:main"

[tool.setuptools.packages.find]
include = ["rtxopt*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gpu: needs an NVIDIA GPU (skipped in CI)"]

[tool.ruff]
extend-exclude = ["phase-0", "phase-1", "phase-2", "phase-3"]
line-length = 100
target-version = "py312"
